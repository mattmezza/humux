name: Go workspace image

# Always report a result, including application/docs PRs. Workflow-level path
# filters can leave required checks pending when GitHub skips the workflow.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: go-workspace-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/github-script@v7
        id: paths
        with:
          script: |
            // Toolchain/build dependencies, not copied application sources.
            // Application changes get the standard-image smoke test on release.
            const inputs = new Set([
              'humux/Dockerfile',
              'humux/.dockerignore',
              'humux/pyproject.toml',
              'humux/uv.lock',
              'humux/tests/smoke_go_toolchain.sh',
              'humux/tests/smoke_go_image.sh',
              '.github/workflows/go-toolchain.yml',
              '.github/workflows/release.yml',
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number, per_page: 100,
            });
            // GitHub caps this endpoint at 3000 files: build conservatively.
            const relevant = files.length >= 3000 || files.some(file =>
              inputs.has(file.filename) || inputs.has(file.previous_filename));
            core.setOutput('relevant', String(relevant));
            core.info(relevant ? 'Build both Go variants' : 'No toolchain inputs changed');

  smoke:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # Both builds use this builder: common stages are solved/downloaded once.
      - uses: docker/setup-buildx-action@v3
      - name: Build standard image
        uses: docker/build-push-action@v6
        with:
          context: ./humux
          load: true
          tags: humux-go-smoke:${{ github.run_id }}-${{ github.run_attempt }}-true
          cache-from: |
            type=gha,scope=humux-image-go-true
            type=gha,scope=humux-image-go-false
          cache-to: type=gha,mode=max,scope=humux-image-go-true
      - name: Verify standard image and persistent caches
        run: sh humux/tests/smoke_go_image.sh "humux-go-smoke:${{ github.run_id }}-${{ github.run_attempt }}-true"
      - name: Build Go-disabled image
        uses: docker/build-push-action@v6
        with:
          context: ./humux
          load: true
          tags: humux-go-smoke:${{ github.run_id }}-${{ github.run_attempt }}-false
          build-args: INSTALL_GO=false
          cache-from: |
            type=gha,scope=humux-image-go-false
            type=gha,scope=humux-image-go-true
          cache-to: type=gha,mode=max,scope=humux-image-go-false
      - name: Verify Go is absent and wacli works
        run: sh humux/tests/smoke_go_image.sh "humux-go-smoke:${{ github.run_id }}-${{ github.run_attempt }}-false" disabled

  result:
    name: Go workspace image
    if: always() && !cancelled()
    needs: [changes, smoke]
    runs-on: self-hosted
    steps:
      - name: Report build or intentional skip
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          test "$CHANGES" = success
          if [ "$RELEVANT" = true ]; then
            test "$SMOKE" = success
          else
            test "$SMOKE" = skipped
            echo 'No toolchain inputs changed; image builds skipped.'
          fi
