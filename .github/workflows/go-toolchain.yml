name: Go workspace image

on:
  pull_request:
    paths:
      - 'humux/Dockerfile'
      - 'humux/tests/smoke_go_toolchain.sh'
      - '.github/workflows/go-toolchain.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: self-hosted
    strategy:
      matrix:
        install-go: ['true', 'false']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./humux
          load: true
          tags: humux-go-smoke:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.install-go }}
          build-args: |
            INSTALL_GO=${{ matrix.install-go }}
            INSTALL_NODE=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime toolchain and persistent caches
        env:
          INSTALL_GO: ${{ matrix.install-go }}
          GO_SMOKE_IMAGE: humux-go-smoke:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.install-go }}
          GO_SMOKE_VOLUME: humux-go-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.install-go }}
        run: |
          if [ "$INSTALL_GO" = true ]; then
            docker run --rm -i --entrypoint sh \
              -v "$GO_SMOKE_VOLUME:/app/data" \
              "$GO_SMOKE_IMAGE" -s < humux/tests/smoke_go_toolchain.sh
            docker run --rm --entrypoint sh \
              -v "$GO_SMOKE_VOLUME:/app/data" \
              "$GO_SMOKE_IMAGE" -c \
              'test -d /app/data/go/pkg/mod && test -n "$(ls -A /app/data/go-build-cache)"'
          else
            docker run --rm -i --entrypoint sh \
              "$GO_SMOKE_IMAGE" -s -- disabled < humux/tests/smoke_go_toolchain.sh
          fi
      - name: Remove smoke-test cache volume
        if: always() && matrix.install-go == 'true'
        run: docker volume rm "humux-go-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.install-go }}" || true
