name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'whistle-v')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        working-directory: ./humux
        run: uv sync
      - name: Lint
        working-directory: ./humux
        run: uv run ruff check .
      - name: Test
        working-directory: ./humux
        run: uv run pytest -n auto

  docker:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Isolate registry credentials from other runner jobs
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mattmezza/humux
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest
      - name: Build standard release image
        uses: docker/build-push-action@v6
        with:
          context: ./humux
          load: true
          tags: humux-release:${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=humux-image-go-true
          cache-to: type=gha,mode=max,scope=humux-image-go-true
      - name: Smoke-test exact standard image before publishing
        run: sh humux/tests/smoke_go_image.sh "humux-release:${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Push tested image without rebuilding
        env:
          IMAGE: humux-release:${{ github.run_id }}-${{ github.run_attempt }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Upload layers once, then publish the remaining tags as manifests.
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          test "${#tags[@]}" -gt 0
          docker tag "$IMAGE" "${tags[0]}"
          docker push "${tags[0]}"
          source=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          aliases=()
          for tag in "${tags[@]:1}"; do
            aliases+=(--tag "$tag")
          done
          if [ "${#aliases[@]}" -gt 0 ]; then
            docker buildx imagetools create --prefer-index=false "${aliases[@]}" "$source"
          fi
