{# Identity and status — refreshed via HTMX into #status-badge. #}
{% set status_label = status or (running and 'RUNNING' or 'STOPPED') %}
<span class="agent-name">{{ agent_name }}</span>
<button class="status-control" type="button" onclick="openAgentModal()"
        aria-label="Agent status: {{ status_label }}. Open agent controls" title="{{ status_label }} — open agent controls">
  <span class="status-dot" data-status="{{ status_label }}" aria-hidden="true"></span>
</button>
